<text x="56" y="356" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#AEBAC8" font-weight="400" text-anchor="start">genotype to vary, so siblings correlate at 0.54</text>
<text x="56" y="376" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#AEBAC8" font-weight="400" text-anchor="start">where theory says 0.21, and heritability cannot</text>
