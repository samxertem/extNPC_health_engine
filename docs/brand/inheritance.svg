<text x="656" y="66" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4EC9E0" font-weight="700" text-anchor="start" letter-spacing="2">MEIOSIS</text>
