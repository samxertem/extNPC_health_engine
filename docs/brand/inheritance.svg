<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="t d">
<title id="t">Blending against meiosis</title>
<desc id="d">Left: under blending every child lands on the midparent value. Right: under meiosis each child is an independent recombined mosaic of the parental haplotypes.</desc>
<rect x="1" y="1" width="1198" height="428" fill="#0B0E14" rx="14" stroke="#1F2733" stroke-width="1"/>
<rect x="30" y="30" width="540" height="370" fill="#0E141C" rx="12" stroke="#1F2733" stroke-width="1"/>
<text x="56" y="66" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#F2C14E" font-weight="700" text-anchor="start" letter-spacing="2">BLENDING</text>
<text x="56" y="94" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#E6EDF3" font-weight="600" text-anchor="start">child = (mother + father) / 2 + noise</text>
<text x="56" y="132" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#6E7B8B" font-weight="600" text-anchor="start">mother</text>
