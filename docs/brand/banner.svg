<text x="404" y="172" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#4EC9E0" font-weight="600" text-anchor="start" letter-spacing="0.4">Simulated Ancestry, Meiosis And Regulatory Architecture</text>
<line x1="404" y1="194" x2="1140" y2="194" stroke="#1F2733" stroke-width="1" stroke-linecap="round"/>
<text x="404" y="222" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#AEBAC8" font-weight="400" text-anchor="start">A quantitative-genetics engine for believable non-player characters.</text>
<text x="404" y="246" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#AEBAC8" font-weight="400" text-anchor="start">Real meiosis, a declared heritability, and twenty population-genetics</text>
<text x="404" y="268" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#AEBAC8" font-weight="400" text-anchor="start">laws measured from its own output rather than computed into it.</text>
