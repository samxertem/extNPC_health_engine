<title id="t">SAMARA architecture</title>
<desc id="d">Engine feeds Simulation, which exports a CSV bundle read by both the Dashboard and the Unity Viewer, the two held to identical output by a generated parity fixture. A validation harness reads the output back and never writes into it.</desc>
