# Continuous integration.
#
# The project's central claim is that a seeded run is reproducible. Until this
# file existed, that claim was checked when somebody thought to check it, which
# is how a reproducibility defect survived several development cycles: it was
# real from the commit that introduced it and found much later.
#
# Three jobs, deliberately separate, because they fail for different reasons
# and a reader should be able to tell which one broke:
#
#   repo     seconds   house rules, dead links, generated artefacts
#   tests    ~8 min    the full suite, including the property-based tests
#   figures  ~12 min   regenerate every figure and diff what it PLOTS
#
# Dependencies come from uv.lock, not from requirements.txt. The lock pins all
# 49 packages with hashes; requirements.txt pins the 8 direct ones and lets
# the rest float, which is precisely the gap a reproducibility claim cannot
# afford. `--frozen` additionally fails if the lock and pyproject.toml have
# drifted, so CI cannot silently test a different stack.
#
# The Unity EditMode suite is NOT here. Running it needs a Unity licence in
# the runner, and a job that cannot pass is worse than a job that does not
# exist. It runs locally through run_unity_tests.py.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; there is no value in finishing a run
# whose commit is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: House rules, links, and generated artefacts
        # The diagram generator writes SVG text and imports nothing but the
        # standard library, so this job needs no scientific stack at all.
        run: uv run --frozen --no-sync python tools/check_repo.py

  tests:
    name: test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked graph
        run: uv sync --frozen
      - name: Report the stack the results are conditioned on
        run: |
          uv run --frozen python -c "import sys; print(sys.version)"
          uv run --frozen python -c "import numpy, scipy, matplotlib; print('numpy', numpy.__version__, '| scipy', scipy.__version__, '| matplotlib', matplotlib.__version__)"
      - name: Run the suite
        run: uv run --frozen python -m pytest tests/ -q --durations=10

  figures:
    name: figures reproduce
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # check_figures reads the committed manifest out of git, so the job
          # needs the object, not just the worktree.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install the locked graph
        run: uv sync --frozen
      - name: Regenerate every figure and its manifest
        run: uv run --frozen python health_engine_prototype.py
      - name: Diff what the figures plot, not how they were rasterised
        # PNG bytes differ across platforms for font reasons that say nothing
        # about the model. The manifests carry the numbers; those are compared
        # with an explicit tolerance. See tools/check_figures.py.
        run: uv run --frozen python tools/check_figures.py --tol 1e-9
      - name: Keep the regenerated figures when they disagree
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-figures
          path: |
            outputs/*.png
            outputs/*.json
          retention-days: 14
